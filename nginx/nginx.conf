worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Rate limit: 1 upload / 20 s / IP  (3 req/min ≈ 1 every 20 s)
    limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # CORS — allow requests from the Hostinger frontend domain
        set $cors_origin "";
        if ($http_origin ~* "^https?://(screenfake\.xyz|www\.screenfake\.xyz)$") {
            set $cors_origin $http_origin;
        }

        # Security headers
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header X-Frame-Options         "DENY"        always;

        # Upload endpoint — rate-limited, no access log (privacy)
        location = /api/uploads {
            limit_req  zone=upload burst=2 nodelay;
            access_log off;

            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                return 204;
            }

            proxy_pass         http://backend:5000;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
        }

        # General API proxy
        location /api/ {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                return 204;
            }

            proxy_pass         http://backend:5000;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
        }

        # Public media — read-only static files
        location /media/ {
            alias      /data/media/;
            access_log off;

            add_header Cache-Control          "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin $cors_origin always;
        }
    }
}
