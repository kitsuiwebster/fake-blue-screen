worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Rate limit: 1 upload / 20 s / IP  (3 req/min ≈ 1 every 20 s)
    limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Security headers
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;

        # Angular SPA
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|woff2|ico|png|jpg|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Public media — read-only static files from bind mount
        location /media/ {
            alias      /data/media/;
            access_log off;
            add_header Cache-Control         "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Upload endpoint — rate-limited, no access log (privacy)
        location = /api/uploads {
            limit_req  zone=upload burst=2 nodelay;
            access_log off;
            proxy_pass         http://backend:5000;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
        }

        # General API proxy
        location /api/ {
            proxy_pass         http://backend:5000;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
        }
    }
}
