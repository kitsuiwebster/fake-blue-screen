name: CI/CD

on:
  push:
    branches: ["main", "raph"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CI_API_KEY: ${{ secrets.CI_API_KEY }}
      API_URL: https://api.screenfake.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # ── Security ────────────────────────────────────────────────────────────

      - name: Trivy vulnerability scan
        id: trivy_scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running Trivy scan (attempt $attempt/$max_attempts)..."
            trivy_output="$(
              docker run --rm \
                -v "$PWD:/src" \
                aquasec/trivy:0.60.0 \
                fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --format sarif \
                --output /src/trivy-results.sarif \
                /src 2>&1
            )"
            trivy_exit="$?"

            printf '%s\n' "$trivy_output"

            if [ "$trivy_exit" -eq 0 ]; then
              exit 0
            fi

            if echo "$trivy_output" | grep -Eiq "timeout|TLS handshake timeout|connection reset|i/o timeout|temporary failure|Too Many Requests|429"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error while running Trivy, retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning::Trivy scan skipped due to transient fetch/network errors after retries."
              exit 0
            fi

            echo "::warning::Trivy scan failed (non-blocking)."
            exit 0
          done

      - name: Check Trivy SARIF file
        if: always()
        id: trivy_sarif
        shell: bash
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy SARIF file not generated. Skipping SARIF upload."
          fi

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && steps.trivy_sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Report Trivy results to backend
        if: ${{ always() && env.CI_API_KEY != '' }}
        shell: bash
        run: |
          trivy_status="passed"
          vuln_count=0
          if [ -f trivy-results.sarif ]; then
            vuln_count=$(python3 -c "import json; print(len(json.load(open('trivy-results.sarif')).get('runs',[{}])[0].get('results',[])))" 2>/dev/null || echo "0")
            if [ "$vuln_count" -gt 0 ]; then
              trivy_status="failed"
            fi
          fi
          echo "Reporting Trivy: status=$trivy_status vulns=$vuln_count"
          response=$(curl -sw "\nHTTP_CODE:%{http_code}" -X POST "$API_URL/api/admin/ci-report" \
            -H "Content-Type: application/json" \
            -H "X-CI-API-Key: $CI_API_KEY" \
            --connect-timeout 10 --max-time 30 \
            -d "{\"type\":\"trivy_frontend\",\"status\":\"$trivy_status\",\"data\":{\"vulnerabilities\":$vuln_count,\"commit\":\"$GITHUB_SHA\"}}" 2>&1) || true
          echo "$response"

      # ── Tests & quality ─────────────────────────────────────────────────────

      - name: Unit tests (headless)
        id: angular_tests
        continue-on-error: true
        working-directory: frontend
        run: yarn test -- --watch=false --browsers=ChromeHeadless

      - name: Report Angular tests to backend
        if: ${{ always() && env.CI_API_KEY != '' }}
        shell: bash
        run: |
          test_status="passed"
          if [ "${{ steps.angular_tests.outcome }}" != "success" ]; then
            test_status="failed"
          fi
          echo "Reporting Angular tests: status=$test_status"
          response=$(curl -sw "\nHTTP_CODE:%{http_code}" -X POST "$API_URL/api/admin/ci-report" \
            -H "Content-Type: application/json" \
            -H "X-CI-API-Key: $CI_API_KEY" \
            --connect-timeout 10 --max-time 30 \
            -d "{\"type\":\"angular_tests\",\"status\":\"$test_status\",\"data\":{\"commit\":\"$GITHUB_SHA\"}}" 2>&1) || true
          echo "$response"

      - name: Fail if tests failed
        if: ${{ steps.angular_tests.outcome == 'failure' }}
        run: exit 1

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build
        working-directory: frontend
        run: yarn build

  frontend-cd:
    runs-on: ubuntu-latest
    needs: backend-cd
    if: ${{ github.event_name == 'push' }}
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: yarn build

      - name: Deploy frontend (FTPS) - attempt 1
        id: frontend_deploy_1
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Deploy frontend (FTPS) - attempt 2
        id: frontend_deploy_2
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_1.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Deploy frontend (FTPS) - attempt 3
        id: frontend_deploy_3
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Fail frontend deploy after retries
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_1.outcome == 'failure' && steps.frontend_deploy_2.outcome == 'failure' && steps.frontend_deploy_3.outcome == 'failure' }}
        run: |
          echo "Frontend FTPS deploy failed after 3 attempts."
          exit 1

  backend-ci:
    runs-on: ubuntu-latest
    env:
      CI_API_KEY: ${{ secrets.CI_API_KEY }}
      API_URL: https://api.screenfake.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install CI tools
        run: pip install ruff bandit pytest

      # ── Linting & formatting ─────────────────────────────────────────────────

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      # ── Security ────────────────────────────────────────────────────────────

      - name: Bandit security scan
        working-directory: backend
        run: bandit -r . -c pyproject.toml -f json -o bandit-report.json || true

      - name: Bandit check results
        working-directory: backend
        shell: bash
        run: |
          if [ -f bandit-report.json ]; then
            high=$(python -c "import json; r=json.load(open('bandit-report.json')); print(sum(1 for i in r.get('results',[]) if i['issue_severity']=='HIGH'))")
            echo "High severity issues: $high"
            if [ "$high" -gt 0 ]; then
              echo "::error::Bandit found $high high-severity security issues"
              cat bandit-report.json | python -m json.tool
              exit 1
            fi
          fi

      - name: Trivy vulnerability scan (backend)
        id: trivy_backend
        continue-on-error: true
        shell: bash
        run: |
          set +e
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running Trivy scan (attempt $attempt/$max_attempts)..."
            trivy_output="$(
              docker run --rm \
                -v "$PWD/backend:/src" \
                aquasec/trivy:0.60.0 \
                fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                /src 2>&1
            )"
            trivy_exit="$?"

            printf '%s\n' "$trivy_output"

            if [ "$trivy_exit" -eq 0 ]; then
              exit 0
            fi

            if echo "$trivy_output" | grep -Eiq "timeout|TLS handshake timeout|connection reset|i/o timeout|temporary failure|Too Many Requests|429"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error while running Trivy, retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning::Trivy scan skipped due to transient network errors after retries."
              exit 0
            fi

            echo "::warning::Trivy scan failed (non-blocking)."
            exit 0
          done

      - name: Report Trivy backend results
        if: ${{ always() && env.CI_API_KEY != '' }}
        shell: bash
        run: |
          trivy_status="passed"
          if [ "${{ steps.trivy_backend.outcome }}" != "success" ]; then
            trivy_status="failed"
          fi
          echo "Reporting Trivy backend: status=$trivy_status"
          response=$(curl -sw "\nHTTP_CODE:%{http_code}" -X POST "$API_URL/api/admin/ci-report" \
            -H "Content-Type: application/json" \
            -H "X-CI-API-Key: $CI_API_KEY" \
            --connect-timeout 10 --max-time 30 \
            -d "{\"type\":\"trivy_backend\",\"status\":\"$trivy_status\",\"data\":{\"commit\":\"$GITHUB_SHA\"}}" 2>&1) || true
          echo "$response"

      # ── Tests ─────────────────────────────────────────────────────────────

      - name: Unit tests
        id: pytest_tests
        continue-on-error: true
        working-directory: backend
        run: pytest tests/ -v

      - name: Report pytest results
        if: ${{ always() && env.CI_API_KEY != '' }}
        shell: bash
        run: |
          test_status="passed"
          if [ "${{ steps.pytest_tests.outcome }}" != "success" ]; then
            test_status="failed"
          fi
          echo "Reporting pytest: status=$test_status"
          response=$(curl -sw "\nHTTP_CODE:%{http_code}" -X POST "$API_URL/api/admin/ci-report" \
            -H "Content-Type: application/json" \
            -H "X-CI-API-Key: $CI_API_KEY" \
            --connect-timeout 10 --max-time 30 \
            -d "{\"type\":\"pytest\",\"status\":\"$test_status\",\"data\":{\"commit\":\"$GITHUB_SHA\"}}" 2>&1) || true
          echo "$response"

      - name: Fail if tests failed
        if: ${{ steps.pytest_tests.outcome == 'failure' }}
        run: exit 1

      # ── Quality ──────────────────────────────────────────────────────────────

      - name: Python syntax check
        run: python -m compileall backend

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build backend Docker image
        run: docker build -t fake-blue-screen-backend:ci ./backend

  sonarqube:
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CI_API_KEY: ${{ secrets.CI_API_KEY }}
      API_URL: https://api.screenfake.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        id: sonar_scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Check SonarQube Quality Gate
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        id: sonar_gate
        shell: bash
        run: |
          echo "Waiting for SonarCloud analysis to complete..."
          sleep 10
          gate_status=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=kitsuiwebster_fake-blue-screen" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('projectStatus',{}).get('status','NONE'))" 2>/dev/null || echo "NONE")
          echo "Quality Gate: $gate_status"
          if [ "$gate_status" = "OK" ]; then
            echo "gate=passed" >> "$GITHUB_OUTPUT"
          else
            echo "gate=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report SonarQube results to backend
        if: ${{ always() && env.CI_API_KEY != '' }}
        shell: bash
        run: |
          sonar_status="${{ steps.sonar_gate.outputs.gate || 'failed' }}"
          if [ "${{ steps.sonar_scan.outcome }}" != "success" ]; then
            sonar_status="failed"
          fi
          echo "Reporting SonarQube: status=$sonar_status"
          response=$(curl -sw "\nHTTP_CODE:%{http_code}" -X POST "$API_URL/api/admin/ci-report" \
            -H "Content-Type: application/json" \
            -H "X-CI-API-Key: $CI_API_KEY" \
            --connect-timeout 10 --max-time 30 \
            -d "{\"type\":\"sonarqube\",\"status\":\"$sonar_status\",\"data\":{\"commit\":\"$GITHUB_SHA\"}}" 2>&1) || true
          echo "$response"

      - name: SonarQube Quality Gate result
        if: ${{ steps.sonar_gate.outputs.gate == 'failed' }}
        run: echo "::warning::SonarQube Quality Gate failed — reported to admin dashboard"

  backend-cd:
    runs-on: ubuntu-latest
    needs: sonarqube
    if: ${{ github.event_name == 'push' }}
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Deploy backend to VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_APP_DIR }}
            git pull
            docker compose up -d --build --remove-orphans

      - name: Health check
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            echo "Waiting for backend to start..."
            sleep 10
            for i in 1 2 3 4 5; do
              http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || true)
              if [ "$http_code" = "200" ]; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Attempt $i: got status $http_code, retrying in 5s..."
              sleep 5
            done
            echo "::error::Health check failed after 5 attempts"
            exit 1
