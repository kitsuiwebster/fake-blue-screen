name: CI/CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: frontend   # all `run` steps execute inside frontend/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: yarn install --frozen-lockfile

      # ── Security ────────────────────────────────────────────────────────────

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."           # scans entire repo from runner root
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Security audit (high+)
        run: yarn audit --level high

      # ── Tests & quality ─────────────────────────────────────────────────────

      - name: Unit tests (headless)
        run: yarn test -- --watch=false --browsers=ChromeHeadless

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build
        run: yarn build

      # ── Deploy frontend (FTPS → data/html served by Nginx) ─────────────────

      - name: Deploy frontend (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 120000
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /data/html/
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      # ── Deploy backend (SSH → docker compose up) ────────────────────────────

      - name: Deploy backend (SSH + Docker Compose)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            docker compose pull
            docker compose up -d --remove-orphans
