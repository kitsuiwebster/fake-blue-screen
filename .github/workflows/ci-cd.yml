name: CI/CD

on:
  push:
    branches: ["main", "raph"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # ── Security ────────────────────────────────────────────────────────────

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Security audit (high+)
        working-directory: frontend
        shell: bash
        run: |
          set -u
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running yarn audit (attempt $attempt/$max_attempts)..."
            set +e
            audit_output="$(yarn audit --level high --json 2>&1)"
            audit_exit="$?"
            set -e

            printf '%s\n' "$audit_output"

            if [ "$audit_exit" -eq 0 ]; then
              exit 0
            fi

            if echo "$audit_output" | grep -Eiq "500 Internal Server Error|ResponseError: Request failed|ENOTFOUND|ETIMEDOUT|ECONNRESET|socket hang up"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Registry/network error during audit, retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning::Security audit skipped due to registry/network failure after retries."
              exit 0
            fi

            echo "yarn audit failed due to detected vulnerabilities or a non-retriable error."
            exit "$audit_exit"
          done
      # ── Tests & quality ─────────────────────────────────────────────────────

      - name: Unit tests (headless)
        working-directory: frontend
        run: yarn test -- --watch=false --browsers=ChromeHeadless

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build
        working-directory: frontend
        run: yarn build

      # ── Deploy frontend (FTPS → Hostinger) ──────────────────────────────────

      - name: Deploy frontend (FTPS)
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 120000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      # ── Deploy backend (SSH → Docker Compose on VPS) ────────────────────────

      - name: Deploy backend (SSH + Docker Compose)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_APP_DIR }}
            git pull
            docker compose up -d --build --remove-orphans
