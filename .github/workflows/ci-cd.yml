name: CI/CD

on:
  push:
    branches: ["main", "raph"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # ── Security ────────────────────────────────────────────────────────────

      - name: Trivy vulnerability scan
        id: trivy_scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running Trivy scan (attempt $attempt/$max_attempts)..."
            trivy_output="$(
              docker run --rm \
                -v "$PWD:/src" \
                aquasec/trivy:0.60.0 \
                fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --format sarif \
                --output /src/trivy-results.sarif \
                /src 2>&1
            )"
            trivy_exit="$?"

            printf '%s\n' "$trivy_output"

            if [ "$trivy_exit" -eq 0 ]; then
              exit 0
            fi

            if echo "$trivy_output" | grep -Eiq "timeout|TLS handshake timeout|connection reset|i/o timeout|temporary failure|Too Many Requests|429"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error while running Trivy, retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning::Trivy scan skipped due to transient fetch/network errors after retries."
              exit 0
            fi

            echo "::warning::Trivy scan failed (non-blocking)."
            exit 0
          done

      - name: Check Trivy SARIF file
        if: always()
        id: trivy_sarif
        shell: bash
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy SARIF file not generated. Skipping SARIF upload."
          fi

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && steps.trivy_sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      # ── Tests & quality ─────────────────────────────────────────────────────

      - name: Unit tests (headless)
        working-directory: frontend
        run: yarn test -- --watch=false --browsers=ChromeHeadless

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build
        working-directory: frontend
        run: yarn build

  frontend-cd:
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: ${{ github.event_name == 'push' }}
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: yarn build

      - name: Deploy frontend (FTPS) - attempt 1
        id: frontend_deploy_1
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Deploy frontend (FTPS) - attempt 2
        id: frontend_deploy_2
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_1.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Deploy frontend (FTPS) - attempt 3
        id: frontend_deploy_3
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          timeout: 300000
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: /
          local-dir: frontend/dist/fake-blue-screen/browser/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Fail frontend deploy after retries
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && steps.frontend_deploy_1.outcome == 'failure' && steps.frontend_deploy_2.outcome == 'failure' && steps.frontend_deploy_3.outcome == 'failure' }}
        run: |
          echo "Frontend FTPS deploy failed after 3 attempts."
          exit 1

  backend-ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install CI tools
        run: pip install ruff bandit pytest

      # ── Linting & formatting ─────────────────────────────────────────────────

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      # ── Security ────────────────────────────────────────────────────────────

      - name: Bandit security scan
        working-directory: backend
        run: bandit -r . -c pyproject.toml -f json -o bandit-report.json || true

      - name: Bandit check results
        working-directory: backend
        shell: bash
        run: |
          if [ -f bandit-report.json ]; then
            high=$(python -c "import json; r=json.load(open('bandit-report.json')); print(sum(1 for i in r.get('results',[]) if i['issue_severity']=='HIGH'))")
            echo "High severity issues: $high"
            if [ "$high" -gt 0 ]; then
              echo "::error::Bandit found $high high-severity security issues"
              cat bandit-report.json | python -m json.tool
              exit 1
            fi
          fi

      - name: Trivy vulnerability scan (backend)
        id: trivy_backend
        continue-on-error: true
        shell: bash
        run: |
          set +e
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running Trivy scan (attempt $attempt/$max_attempts)..."
            trivy_output="$(
              docker run --rm \
                -v "$PWD/backend:/src" \
                aquasec/trivy:0.60.0 \
                fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                /src 2>&1
            )"
            trivy_exit="$?"

            printf '%s\n' "$trivy_output"

            if [ "$trivy_exit" -eq 0 ]; then
              exit 0
            fi

            if echo "$trivy_output" | grep -Eiq "timeout|TLS handshake timeout|connection reset|i/o timeout|temporary failure|Too Many Requests|429"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error while running Trivy, retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning::Trivy scan skipped due to transient network errors after retries."
              exit 0
            fi

            echo "::warning::Trivy scan failed (non-blocking)."
            exit 0
          done

      # ── Tests ─────────────────────────────────────────────────────────────

      - name: Unit tests
        working-directory: backend
        run: pytest tests/ -v

      # ── Quality ──────────────────────────────────────────────────────────────

      - name: Python syntax check
        run: python -m compileall backend

      - name: SonarQube Cloud scan (backend)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build backend Docker image
        run: docker build -t fake-blue-screen-backend:ci ./backend

  backend-cd:
    runs-on: ubuntu-latest
    needs: backend-ci
    if: ${{ github.event_name == 'push' }}
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Deploy backend to VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_APP_DIR }}
            git pull
            docker compose up -d --build --remove-orphans backend

      - name: Health check
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            echo "Waiting for backend to start..."
            sleep 10
            for i in 1 2 3 4 5; do
              http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || true)
              if [ "$http_code" = "200" ]; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Attempt $i: got status $http_code, retrying in 5s..."
              sleep 5
            done
            echo "::error::Health check failed after 5 attempts"
            exit 1
