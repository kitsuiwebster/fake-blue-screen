[project]
name = "fake-blue-screen-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
]
ignore = [
    "S104",   # binding to all interfaces (expected for Docker)
    "S105",   # hardcoded password variable names (false positives on config)
    "S110",   # try-except-pass (intentional for file cleanup)
    "S311",   # pseudo-random generators (used for captcha visuals, not crypto)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]  # binding to 0.0.0.0 is intentional (Docker)
