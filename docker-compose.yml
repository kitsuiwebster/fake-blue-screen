services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./data/media:/data/media:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    expose:
      - "5000"
    restart: unless-stopped
