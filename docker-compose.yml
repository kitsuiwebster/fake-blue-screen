services:
  backend:
    build: ./backend
    environment:
      - DATA_DIR=/data
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - CI_API_KEY=${CI_API_KEY}
    ports:
      - "127.0.0.1:${BACK_PORT:-5000}:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:80"
    restart: unless-stopped
